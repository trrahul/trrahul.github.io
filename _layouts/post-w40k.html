---
layout: compress
---

<!doctype html>

{% include origin-type.html %}

{% include lang.html %}

{% if site.theme_mode %}
  {% capture prefer_mode %}data-mode="{{ site.theme_mode }}"{% endcapture %}
{% endif %}

<html lang="{{ page.lang | default: site.alt_lang | default: site.lang }}" {{ prefer_mode }}>
  {% include head.html %}

  <body class="w40k-reading">
    <div class="w40k-post-wrapper">
      <div class="w40k-crt-screen">
        <div class="w40k-crt-scanlines"  aria-hidden="true"></div>
        <div class="w40k-crt-noise"      aria-hidden="true"></div>
        <div class="w40k-crt-reflection" aria-hidden="true"></div>
        <div class="w40k-crt-vignette"   aria-hidden="true"></div>
        <div class="w40k-crt-ambient"    aria-hidden="true"></div>

        <article class="w40k-post">
          <nav class="w40k-back-nav">
            <a href="{{ '/' | relative_url }}" class="w40k-back-link">← cd ..</a>
          </nav>

          <h1 class="w40k-post-title">{{ page.title }}</h1>

          <div class="content">
            {{ content }}
          </div>

        </article>
      </div>
    </div>
  </body>
</html>
